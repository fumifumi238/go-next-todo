services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
      - backend/.env
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: mysql-db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    entrypoint: [ "migrate", "-path=/migrations", "-database=${DB_URL}" ]
    env_file:
      - .env
    depends_on:
      - db
    restart: "no"
volumes:
  db-data:
